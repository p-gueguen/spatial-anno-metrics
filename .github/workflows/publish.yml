# Publishes to PyPI when a v* tag is pushed, by trusted publishing (OIDC: no API token in the repo).
#
# INERT until the publisher is registered on PyPI: until then the publish job fails at the token
# exchange ("invalid-publisher") and nothing is uploaded. To arm it, once, from the PyPI account:
#   https://pypi.org/manage/account/publishing/ -> add a pending publisher with
#   project spatial-anno-metrics, owner p-gueguen, repository spatial-anno-metrics,
#   workflow publish.yml, environment pypi.
# GitHub creates the "pypi" environment on the first run; add a required reviewer there for a
# manual gate. To release: set `version` in pyproject.toml, commit, push tag v<version>.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the pyproject version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$v" || { echo "tag $GITHUB_REF_NAME != v$v in pyproject.toml"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spatial-anno-metrics
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
