[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatial-anno-metrics"
version = "0.7.0"
description = "Cell-type annotation quality metrics (spatial + scRNA-seq): internal validity, marker-program fidelity, external harness, deconvolution, and spatial signal QC."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Paul Gueguen" }]
requires-python = ">=3.10"
keywords = [
    "single-cell", "spatial-transcriptomics", "cell-type-annotation",
    "quality-control", "metrics", "xenium", "deconvolution",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Floors are what the lowest-direct CI job installs and tests (.github/workflows/ci.yml).
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "anndata>=0.10",
]

[project.optional-dependencies]
# spatialdata < 0.4 resolves to a dask or xarray-dataclasses release it cannot be imported with.
spatial = ["squidpy>=1.4", "spatialdata>=0.4"]   # Moran's I, spatial neighbour graphs, neighbourhood enrichment
spatialdata = ["spatialdata>=0.4"]               # SpatialData objects as input
docs = ["sphinx", "myst-nb", "furo", "sphinx-autodoc-typehints"]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/p-gueguen/spatial-anno-metrics"
Repository = "https://github.com/p-gueguen/spatial-anno-metrics"
Issues = "https://github.com/p-gueguen/spatial-anno-metrics/issues"
Documentation = "https://spatial-anno-metrics.readthedocs.io"

[tool.hatch.build.targets.wheel]
# Ships every non-ignored file under the package, so src/spatial_anno_metrics/py.typed (PEP 561) is
# included without a force-include (which would fail every build while the file is absent).
packages = ["src/spatial_anno_metrics"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# ruff >=0.16 widened the default rule set (BLE/SIM/RUF/S...); pin the set this code was written against.
select = ["E4", "E7", "E9", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Docstring rules cover the package. Tests and the benchmark / parity scripts are not API: their functions
# are named for what they check and most carry no docstring (D103), or a one-paragraph note (D205/D209/D401).
"tests/**" = ["D"]
"benchmarks/**" = ["D"]
# aqi.py is frozen in this release (no edits): two docstrings with a multi-line summary.
"src/spatial_anno_metrics/aqi.py" = ["D205", "D209"]
